<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Finalmente in Italia</title>
<!-- Animatic for the Italy launch film. Arvo stands in for Museo Slab. Timing and layout reference only, rebuild in After Effects.
     The world is four 1080x1350 panels side by side, laid out like the reference: headline, wave, loop, destination.
     Open film.html to play it, film.html?t=3.6 to hold one frame. render.js drives it with window.render(t). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arvo:wght@400;700&family=Be+Vietnam+Pro:wght@500&display=block">
<style>
  html, body { margin: 0; background: #FFFFFF; }
  svg { display: block; width: 1080px; height: 1350px; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <g id="car">
      <!-- Flat generic hatchback, 74 x 34, origin on the ground line between the wheels. Not modelled on any real car. -->
      <path d="M-35 -9 Q-37 -20 -28 -22 L-17 -23 Q-9 -33 4 -33 L13 -33 Q22 -32 29 -22 L33 -20 Q38 -18 37 -10 L36 -6 L-34 -6 Z" fill="#FFB310"/>
      <path d="M-13 -23 Q-7 -30 3 -30 L5 -30 L5 -23 Z M9 -30 L12 -30 Q19 -29 24 -23 L9 -23 Z" fill="#FFFFFF"/>
      <rect x="-34" y="-14" width="70" height="2.2" fill="#400685" opacity=".9"/>
      <circle cx="-21" cy="-6" r="7.5" fill="#400685"/><circle cx="-21" cy="-6" r="3.2" fill="#CFD2D4"/>
      <circle cx="22" cy="-6" r="7.5" fill="#400685"/><circle cx="22" cy="-6" r="3.2" fill="#CFD2D4"/>
      <rect x="33" y="-19" width="4" height="3" rx="1" fill="#FFFFFF"/>
    </g>
  </defs>
  <g id="cam">
    <!-- Panel 4: the Duomo plate from Higgsfield (plates/duomo-plate.png, take A2). Multiply drops its white ground onto the page. -->
    <image id="plate" href="plates/duomo-plate.png" x="3305" y="120" width="950" height="595" style="mix-blend-mode: multiply"/>
    <text id="siamo" x="256" y="600" font-family="Arvo" font-weight="400" font-size="46" fill="#400685">Siamo</text>
    <text id="head" x="256" y="675" font-family="Arvo" font-weight="400" font-size="70" fill="#400685">FINALMENT</text>
    <g id="letters" font-family="Arvo" font-weight="400" text-anchor="middle"></g>
    <text id="italia" x="3640" y="985" text-anchor="end" font-family="Arvo" font-weight="400" font-size="70" fill="#400685">in Italia</text>
    <image id="logo" href="assets/truvio-logo-violet.svg" x="4035" y="1212" width="220" height="73"/>
    <use id="carUse" href="#car"/>
  </g>
</svg>
<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const W = 1080, SIZE = 70, CAR = 2.6;
  // Darker road: Deep Violet for most of the run, Celestial Blue through the loop, a short green to gold finish at the destination.
  const STOPS = [[0, '#400685'], [0.4, '#400685'], [0.86, '#008FC4'], [0.95, '#2DB34A'], [1, '#FFB310']];
  const $ = id => document.getElementById(id);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, u) => a + (b - a) * u;
  const ease = u => { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); };
  const hex = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
  function grad(u) {
    u = clamp(u, 0, 1);
    let i = 1; while (i < STOPS.length - 1 && u > STOPS[i][0]) i++;
    const [u0, c0] = STOPS[i - 1], [u1, c1] = STOPS[i];
    const a = hex(c0), b = hex(c1), f = (u - u0) / (u1 - u0);
    return `rgb(${a.map((v, k) => Math.round(lerp(v, b[k], f))).join(',')})`;
  }
  // Catmull-Rom through the control points, sampled into a polyline with arc length lookup.
  function spline(c, per = 24) {
    const pts = [];
    for (let i = 0; i < c.length - 1; i++) {
      const p0 = c[Math.max(0, i - 1)], p1 = c[i], p2 = c[i + 1], p3 = c[Math.min(c.length - 1, i + 2)];
      for (let j = 0; j < per; j++) {
        const t = j / per, t2 = t * t, t3 = t2 * t;
        pts.push([0, 1].map(k => 0.5 * (2 * p1[k] + (p2[k] - p0[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (3 * p1[k] - p0[k] - 3 * p2[k] + p3[k]) * t3)));
      }
    }
    pts.push(c[c.length - 1]);
    return pts;
  }
  function line(pts) {
    const s = [0];
    for (let i = 1; i < pts.length; i++) s.push(s[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const at = d => {
      d = clamp(d, 0, s[s.length - 1]);
      let lo = 0, hi = s.length - 1;
      while (hi - lo > 1) { const m = (lo + hi) >> 1; if (s[m] <= d) lo = m; else hi = m; }
      const f = (d - s[lo]) / ((s[hi] - s[lo]) || 1), p = pts[lo], q = pts[hi];
      return [lerp(p[0], q[0], f), lerp(p[1], q[1], f)];
    };
    const tan = (d, w = 6) => { const a = at(d - w), b = at(d + w); return Math.atan2(b[1] - a[1], b[0] - a[0]); };
    const sAtX = x => { for (let i = 1; i < pts.length; i++) if (pts[i][0] >= x) return s[i]; return s[s.length - 1]; };
    return { pts, s, L: s[s.length - 1], at, tan, sAtX };
  }

  let road, K, ready = false;
  function build() {
    const hx = 256 + $('head').getComputedTextLength() - 6;
    const probe = document.createElementNS(NS, 'text');
    probe.setAttribute('font-family', 'Arvo'); probe.setAttribute('font-size', '100');
    probe.textContent = 'EEEEEEEEEE'; $('stage').appendChild(probe);
    const ADV = probe.getComputedTextLength() / 1000 * SIZE * 1.1; probe.remove();  // a little looser than the font, like the reference Y's

    // Road control points, measured off the reference panels and scaled to 1080x1350. Panel k starts at x = 1080k.
    const P1 = [[hx, 675], [hx + 160, 690], [hx + 300, 718], [1080, 783]];
    const P2 = [[1380, 890], [1674, 945], [1960, 900], [2160, 823]];
    const P3 = [[2420, 740], [2689, 513], [2860, 330], [2850, 150], [2732, 95], [2610, 150], [2580, 300], [2689, 513], [2920, 720], [3240, 823]];
    const P4 = [[3420, 855], [3640, 864]];
    const head = [[256, 675], [hx, 675]];
    road = line([...spline(head, 8).slice(0, -1), ...spline([...P1, ...P2, ...P3, ...P4])]);
    const sH = hx - 256;
    K = { sH, b1: road.sAtX(1080), b2: road.sAtX(2160), b3: road.sAtX(3240), L: road.L };

    const n = Math.round((road.L - sH) / ADV), a = (road.L - sH) / n;  // even spacing, last E lands on the road end
    for (let i = 0; i < n; i++) {
      const c = sH + (i + 0.5) * a, [x, y] = road.at(c), ang = road.tan(c, a / 2) * 180 / Math.PI;
      const el = document.createElementNS(NS, 'text');
      el.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${ang.toFixed(1)})`);
      el.setAttribute('font-size', SIZE); el.setAttribute('fill', grad((c - sH) / (road.L - sH)));
      el.textContent = 'E'; $('letters').appendChild(el);
    }
    ready = true;
  }

  // Panels follow the reference timing: 0-2.5 headline, 2.5-5.0 wave, 5.0-9.2 loop, 9.2-12.7 destination.
  const DUR = 12.7, CUTS = [2.5, 5.0, 9.2];
  function carS(t) {
    const k = [[0.5, 300], [CUTS[0], K.b1], [CUTS[1], K.b2], [CUTS[2], K.b3], [10.9, K.L - 37 * CAR]];
    if (t <= k[0][0]) return k[0][1];
    for (let i = 1; i < k.length; i++) if (t <= k[i][0]) {
      let u = (t - k[i - 1][0]) / (k[i][0] - k[i - 1][0]);
      if (i === 1) u = u * u * (2 - u) * 0.5 + u * 0.5; if (i === k.length - 1) u = 1 - (1 - u) * (1 - u);
      return lerp(k[i - 1][1], k[i][1], u);
    }
    return k[k.length - 1][1];
  }

  window.render = function (t) {
    if (!ready) return;
    const c = carS(t), [x, y] = road.at(c), ang = road.tan(c, 30 * CAR), lift = SIZE * 0.69;
    $('carUse').setAttribute('transform', `translate(${(x + Math.sin(ang) * lift).toFixed(1)} ${(y - Math.cos(ang) * lift).toFixed(1)}) rotate(${(ang * 180 / Math.PI).toFixed(1)}) scale(${CAR})`);
    // Camera holds each panel like the reference, and pans to the next as the car crosses the edge.
    let cam = 0;
    CUTS.forEach(tc => { cam += W * ease((t - tc + 0.35) / 0.7); });
    $('cam').setAttribute('transform', `translate(${(-cam).toFixed(1)} 0)`);
    const it = ease((t - 10.6) / 0.5);
    $('italia').setAttribute('opacity', it);
    $('logo').setAttribute('opacity', ease((t - 11.1) / 0.5));
  };
  window.DUR = DUR;

  // Geometry and motion for the After Effects build, read by export-ae.js. World units are px in the 4320x1350 panorama.
  window.exportAE = function (fps = 25) {
    const r1 = v => Math.round(v * 10) / 10;
    const letters = [...$('letters').children].map(el => {
      const m = el.getAttribute('transform').match(/translate\(([-\d.]+) ([-\d.]+)\) rotate\(([-\d.]+)\)/);
      return { x: +m[1], y: +m[2], rot: +m[3], fill: el.getAttribute('fill') };
    });
    const frames = [];
    for (let i = 0; i <= Math.round(DUR * fps); i++) {
      const t = i / fps, c = carS(t), [x, y] = road.at(c), ang = road.tan(c, 30 * CAR), lift = SIZE * 0.69;
      let cam = 0; CUTS.forEach(tc => { cam += W * ease((t - tc + 0.35) / 0.7); });
      frames.push({ f: i, car: [r1(x + Math.sin(ang) * lift), r1(y - Math.cos(ang) * lift), r1(ang * 180 / Math.PI)], camX: r1(cam) });
    }
    return {
      note: 'Measured with Arvo 400 as a stand-in for Museo Slab 500. headEndX moves with the real font, see the handoff.',
      fps, duration: DUR, world: [4320, 1350], frame: [1080, 1350], cuts: CUTS, panDuration: 0.7,
      headline: { siamo: { text: 'Siamo', x: 256, y: 600, size: 46 }, head: { text: 'FINALMENT', x: 256, y: 675, size: 70 }, headEndX: r1(K.sH + 256) },
      letterSize: SIZE, letterCount: letters.length, gradientStops: STOPS,
      roadLength: r1(road.L), roadPolyline: road.pts.filter((p, i) => i % 3 === 0 || i === road.pts.length - 1).map(p => [r1(p[0]), r1(p[1])]),
      letters, car: { scale: CAR, lengthPx: r1(74 * CAR), liftAboveBaseline: r1(SIZE * 0.69) },
      plate: { file: 'plates/duomo-plate.png', x: 3305, y: 120, w: 950, h: 595, blend: 'multiply' },
      italia: { text: 'in Italia', rightX: 3640, y: 985, size: 70, fadeIn: [10.6, 11.1] },
      logo: { file: 'assets/truvio-logo-violet.svg', x: 4035, y: 1212, w: 220, fadeIn: [11.1, 11.6] },
      frames
    };
  };

  document.fonts.load('400 70px Arvo').then(() => document.fonts.load('500 34px "Be Vietnam Pro"')).then(() => {
    build();
    window.filmReady = true;
    const q = new URLSearchParams(location.search);
    if (q.has('t')) render(parseFloat(q.get('t')));
    else { const t0 = performance.now(); const loop = now => { render(((now - t0) / 1000) % (DUR + 1)); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
  });
})();
</script>
</body>
</html>
