Bold'" font-size="52" letter-spacing="-0.73" fill="#141414">How are you handling complex</text><text x="107" y="321.47" font-family="'BeVietnamPro-ExtraBold'" font-size="52" letter-spacing="-0.73" fill="#141414">variants in Business Central?</text></g><g id="Post_body"><text x="107" y="380.22" font-family="'BeVietnamPro-Regular'" font-size="31" fill="#2A2A2A">One product, 12 sizes, 8 colors, 3 materials. Our item</text><text x="107" y="422.98" font-family="'BeVietnamPro-Regular'" font-size="31" fill="#2A2A2A">setup is falling apart.</text></g><rect x="107.5" y="456.25" width="89" height="43" rx="21.5" fill="none" stroke="#CFD2D4" stroke-width="1"/><g transform="translate(122 465.75) scale(1 1)" fill="none" stroke="#6D757A" stroke-width="2" stroke-linejoin="round"><path d="M12 3.2 20.6 12.6H15.4V20.8H8.6V12.6H3.4Z"></path></g><g transform="translate(158 465.75) scale(1 1)" fill="none" stroke="#6D757A" stroke-width="2" stroke-linejoin="round"><path d="M12 20.8 3.4 11.4H8.6V3.2H15.4V11.4H20.6Z"></path></g><rect x="209.5" y="456.25" width="53" height="43" rx="21.5" fill="none" stroke="#CFD2D4" stroke-width="1"/><g transform="translate(224 465.75) scale(1 1)" fill="none" stroke="#6D757A" stroke-width="2" stroke-linejoin="round"><path d="M4.5 5.5h15a1.8 1.8 0 0 1 1.8 1.8v8.4a1.8 1.8 0 0 1-1.8 1.8H11l-4.6 3.6v-3.6H4.5a1.8 1.8 0 0 1-1.8-1.8V7.3a1.8 1.8 0 0 1 1.8-1.8Z"></path></g><rect x="275.5" y="456.25" width="53" height="43" rx="21.5" fill="none" stroke="#CFD2D4" stroke-width="1"/><g transform="translate(290 465.75) scale(1 1)" fill="none" stroke="#6D757A" stroke-width="2" stroke-linejoin="round"><path d="M13.5 4.5 20.5 11l-7 6.5v-3.9C8.6 13.6 5.6 15.3 3.5 19c.6-5.6 3.9-9.4 10-10.4Z"></path></g><g id="Top_answer"><rect x="107" y="525.75" width="866" height="237.53" rx="14" fill="#E6E8FC"/><rect x="133" y="547.75" width="36" height="36" rx="18" fill="#FFB310"/><g transform="translate(139 553.75) scale(1 1)" fill="#fff"><circle cx="12" cy="9" r="4.2"></circle><path d="M4.6 20.4c.9-4 3.8-6.2 7.4-6.2s6.5 2.2 7.4 6.2Z"></path></g><text x="181" y="573.75" font-family="'BeVietnamPro-ExtraBold'" font-size="22" fill="#141414">erp_ops_lead</text><rect x="354.92" y="551.25" width="118.02" height="29" rx="14" fill="#006D5B"/><text x="366.92" y="571.25" font-family="'BeVietnamPro-ExtraBold'" font-size="16" fill="#FFFFFF">Top answer</text><text x="133" y="629.75" font-family="'BeVietnamPro-Regular'" font-size="31" fill="#141414">We moved variants and enrichment into</text><text x="905.31" y="629.75" font-family="'BeVietnamPro-Regular'" font-size="31" fill="#141414">.</text><text x="133" y="672.52" font-family="'BeVietnamPro-Regular'" font-size="31" fill="#141414">It runs inside BC and syncs back only what BC needs.</text><text x="737.88" y="629.75" font-family="'BeVietnamPro-ExtraBold'" font-size="31" fill="#141414">Truvio PIM</text><rect x="133" y="699.28" width="90" height="44" rx="22" fill="#FFFFFF"/><rect x="133.5" y="699.78" width="89" height="43" rx="21.5" fill="none" stroke="#CFD2D4" stroke-width="1"/><g transform="translate(148 709.28) scale(1 1)" fill="#F76336" stroke="#F76336" stroke-width="2" stroke-linejoin="round"><path d="M12 3.2 20.6 12.6H15.4V20.8H8.6V12.6H3.4Z"></path></g><g transform="translate(184 709.28) scale(1 1)" fill="none" stroke="#6D757A" stroke-width="2" stroke-linejoin="round"><path d="M12 20.8 3.4 11.4H8.6V3.2H15.4V11.4H20.6Z"></path></g><rect x="235" y="699.28" width="54" height="44" rx="22" fill="#FFFFFF"/><rect x="235.5" y="699.78" width="53" height="43" rx="21.5" fill="none" stroke="#CFD2D4" stroke-width="1"/><g transform="translate(250 709.28) scale(1 1)" fill="none" stroke="#6D757A" stroke-width="2" stroke-linejoin="round"><path d="M4.5 5.5h15a1.8 1.8 0 0 1 1.8 1.8v8.4a1.8 1.8 0 0 1-1.8 1.8H11l-4.6 3.6v-3.6H4.5a1.8 1.8 0 0 1-1.8-1.8V7.3a1.8 1.8 0 0 1 1.8-1.8Z"></path></g></g></g><g id="Truvio_callout"><rect x="65" y="833.28" width="950" height="132" rx="18" fill="url(#grad2)"/><rect x="67" y="835.28" width="946