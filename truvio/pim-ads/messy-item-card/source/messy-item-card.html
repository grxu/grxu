<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Messy item card</title>
<style>
/* The board fills the render window, so render_mock.sh sets the size (1080x1080 or 1080x1350). */
/* Arvo Bold stands in for Museo Slab. Be Vietnam Pro stands in for Segoe UI inside the BC and PIM UI. */
@page{size:1080px 1080px;margin:0}
@font-face{font-family:'Slab';src:url('fonts/arvo-latin-700-normal.woff2') format('woff2');font-weight:700}
@font-face{font-family:'BVP';src:url('fonts/be-vietnam-pro-latin-400-normal.woff2') format('woff2');font-weight:400}
@font-face{font-family:'BVP';src:url('fonts/be-vietnam-pro-latin-800-normal.woff2') format('woff2');font-weight:800}
:root{
  --violet:#400685; --offwhite:#E6E8FC;
  --red:#F76336; --green:#2DB34A; --blue:#008FC4; --gold:#FFB310; --teal:#006D5B;
  --silver:#CFD2D4; --darkgray:#6D757A;
  --M:65px; --headline:66px; --lockupW:176px;
  --stageTop:300px; --stageBottom:153px;   /* lockup row (58px) + 30px air above it */
  --bcBar:#002B36; --bcTeal:#0F7C8C;       /* BC's own chrome, kept so it reads as Business Central */
  --tint:#B9CDD8;                          /* the house tint for BC set behind the PIM panel */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100vw;height:100vh;overflow:hidden;background:var(--violet)}
body{font-family:'BVP',sans-serif;-webkit-font-smoothing:antialiased;color:#1b1b1b}
.board{position:relative;width:100vw;height:100vh;overflow:hidden;background:var(--violet)}
h1{position:absolute;left:var(--M);top:var(--M);width:900px;z-index:3;font-family:'Slab',serif;font-weight:700;
  font-size:var(--headline);line-height:1.08;letter-spacing:-.012em;color:var(--offwhite)}
.lockup{position:absolute;left:var(--M);bottom:var(--M);width:var(--lockupW);z-index:3}
.cta{position:absolute;right:var(--M);bottom:calc(var(--M) + 14px);z-index:3;font-weight:800;font-size:24px;
  letter-spacing:-.005em;color:var(--offwhite)}

/* Labels above each half */
.label{position:absolute;top:250px;z-index:3;font-weight:800;font-size:22px;color:var(--offwhite);padding-bottom:9px}
.label::after{content:"";position:absolute;left:0;bottom:0;width:56px;height:4px;border-radius:2px}
.label.l{left:var(--M)} .label.l::after{background:var(--red)}
.label.r{left:555px} .label.r::after{background:linear-gradient(64.6deg,#33B4E8,var(--green) 55%,var(--gold))}

.shadow{filter:drop-shadow(1px 2px 2px rgba(14,0,40,.35)) drop-shadow(10px 18px 26px rgba(14,0,40,.45))}

/* ---------- BC item card ---------- */
.bc{position:absolute;top:var(--stageTop);bottom:var(--stageBottom);border-radius:10px;overflow:hidden;background:#fff}
.bc .bar{height:40px;background:var(--bcBar);display:flex;align-items:center;gap:12px;color:#fff;font-weight:800;font-size:12.5px}
.bc .waffle{width:40px;height:40px;background:var(--bcTeal);display:grid;place-items:center}
.bc .waffle i{display:grid;grid-template-columns:repeat(3,3px);gap:3px}
.bc .waffle i b{width:3px;height:3px;background:#fff;border-radius:1px}
.bc .body{position:absolute;top:40px;left:0;right:0;bottom:0;padding:12px 26px 0 18px;overflow:hidden}
.bc .crumb{font-size:10px;color:#5f6b72}
.bc .title{font-size:15px;color:#1b1b1b;margin-top:1px;white-space:nowrap}
.bc .actions{display:flex;gap:12px;margin:10px 0 8px;padding-bottom:8px;border-bottom:1px solid #e3e6e8}
.bc .actions span{height:6px;border-radius:3px;background:var(--silver)}
.bc .actions span.on{background:var(--bcTeal)}
.tab{font-weight:800;font-size:11.5px;margin:7px 0 4px;padding-bottom:4px;border-bottom:1px solid #d9dde0}
.fields{display:grid;grid-template-columns:1fr 1fr;column-gap:12px;row-gap:3px}
.f{display:grid;grid-template-columns:94px 1fr;align-items:center;gap:5px;min-height:17px}
.f .k{font-size:9.5px;color:#4b555b;white-space:nowrap;overflow:hidden}
.f .k.bar{height:5px;border-radius:3px;background:#C3C8CB;width:70%}
.f .v{height:16px;border:1px solid #B9BFC3;border-radius:3px;padding:0 5px;display:flex;align-items:center;font-size:9.5px}
.f .v i{height:5px;border-radius:3px;background:#9AA2A7;width:var(--w,60%)}
.f .v.ro{background:#EEF0F1;border-color:#EEF0F1}
.f .v.tog{width:26px;height:13px;border-radius:7px;border:1px solid #6d757a;padding:2px}
.f .v.tog::before{content:"";width:7px;height:7px;border-radius:50%;background:#6d757a}
/* Custom enrichment fields: Prometheus Red outline + 10 percent tint */
.f.custom{grid-column:1 / -1;grid-template-columns:94px 1fr;align-items:start;padding:5px 6px;margin:1px -6px;
  border:2px solid var(--red);border-radius:5px;background:rgba(247,99,54,.10)}
.f.custom .k.bar{margin-top:5px;background:#C9A69B}
.f.custom .v{height:auto;flex-direction:column;align-items:stretch;gap:4px;padding:5px;background:#fff}
.f.custom .v i{width:100%} .f.custom .v i:last-child{width:var(--w,55%)}
.scroll{position:absolute;right:7px;top:52px;bottom:10px;width:6px;border-radius:3px;background:#E3E6E8}
.scroll::before{content:"";position:absolute;left:0;right:0;top:4px;height:34px;border-radius:3px;background:#8F989D}

.bc.messy{left:var(--M);width:460px}
.bc.clean{left:555px;width:330px;background:var(--tint)}
.bc.clean .body{padding:16px 18px 0 18px}
.bc.clean .crumb{color:#4d6470} .bc.clean .title{font-size:14px;color:#24414f}
.bc.clean .actions{border-color:#a4bcc8} .bc.clean .actions span{background:#9DB6C3} .bc.clean .actions span.on{background:var(--bcTeal)}
.bc.clean .tab{border-color:#a4bcc8;color:#1e3a48;margin-top:16px}
.bc.clean .fields{grid-template-columns:1fr;row-gap:12px}
.bc.clean .f{grid-template-columns:104px 82px}
.bc.clean .f .k{color:#2f4b59} .bc.clean .f .k.bar{background:#93ADBA}
.bc.clean .f .v{border-color:#93ADBA;background:#C9DAE3} .bc.clean .f .v i{background:#7F9AA8}
.bc.clean .f .v.ro{background:#A9C0CC;border-color:#A9C0CC}

/* ---------- Truvio PIM Product View panel ---------- */
.pim{position:absolute;left:728px;right:var(--M);top:calc(var(--stageTop) - 6px);bottom:calc(var(--stageBottom) - 6px);
  background:#fff;border-radius:12px;overflow:hidden;padding:16px 16px 0;
  box-shadow:0 0 0 1px rgba(156,157,236,.55),0 0 22px rgba(156,157,236,.55)}
.pim .top{display:flex;align-items:center;gap:9px}
.pim .back{width:24px;height:24px;border-radius:50%;background:#E7F1F5;display:grid;place-items:center}
.pim .addin{font-size:10px;color:#6d757a}
.pim .name{font-size:15.5px;color:#2b2b2b;margin:2px 0 0 33px;white-space:nowrap}
.pim .hero{margin-top:12px;background:#F1F2F3;border-radius:7px;padding:9px;display:grid;grid-template-columns:62px 1fr;gap:9px;align-items:center}
.pim .thumb{width:62px;height:62px;background:#fff;border-radius:4px;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pim .pname{font-weight:800;font-size:12px;line-height:1.2;color:#111}
.pim .pid{height:5px;width:58%;border-radius:3px;background:#B9BFC3;margin-top:6px}
.pim .master{display:inline-block;margin-top:6px;font-weight:800;font-size:8.5px;color:#fff;background:var(--teal);padding:2px 6px;border-radius:7px}
.pim .tabs{margin-top:9px;background:#F1F2F3;height:28px;border-radius:4px;display:flex;align-items:center;justify-content:space-around;padding:0 8px}
.pim .tabs span{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:800;color:#111}
.pim .tabs span em{width:26px;height:5px;border-radius:3px;background:#B9BFC3}
.pim .sec{font-weight:800;font-size:11px;margin:12px 0 7px}
.pim .row{display:grid;grid-template-columns:34px 1fr 26px 12px;gap:8px;align-items:center;border:1px solid #DADDE0;border-radius:5px;padding:5px 8px 5px 5px;margin-bottom:6px}
.pim .row .t{width:34px;height:34px;border:1px solid #E3E6E8;border-radius:3px;display:grid;place-items:center}
.pim .row .fn{height:5px;width:70%;border-radius:3px;background:#555}
.pim .row .fs{height:4px;width:45%;border-radius:2px;background:#C3C8CB;margin-top:5px}
.pim .row .en{font-size:8.5px;font-weight:800;border:1px solid #C3C8CB;border-radius:8px;text-align:center;padding:1px 0}
#qa{display:none}
</style>
</head>
<body>
<div class="board" id="board">
  <h1>Your item card wasn't<br>built for this.</h1>
  <div class="label l">BC item card today</div>
  <div class="label r">With Truvio PIM</div>

  <!-- Left: today's cluttered item card -->
  <div class="bc messy shadow">
    <div class="bar"><div class="waffle"><i><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></i></div>Dynamics 365 Business Central</div>
    <div class="body" id="messy"></div>
    <div class="scroll"></div>
  </div>

  <!-- Right: the same card, clean, with the PIM panel in front -->
  <div class="bc clean shadow">
    <div class="bar"><div class="waffle"><i><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></i></div>Dynamics 365 Business Central</div>
    <div class="body" id="clean"></div>
  </div>

  <div class="pim" id="pim">
    <div class="top">
      <div class="back"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M10 6H2.5M6 2.2 2.2 6 6 9.8" fill="none" stroke="#2b5966" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="addin">Add-in</div>
    </div>
    <div class="name">Truvio PIM Product View</div>
    <div class="hero">
      <div class="thumb"><svg width="54" height="34" viewBox="0 0 54 34"><g fill="none" stroke-width="2.4"><circle cx="11" cy="22" r="9" stroke="#1d2a30"/><circle cx="43" cy="22" r="9" stroke="#1d2a30"/><path d="M11 22 20 9h17l6 13M20 9l7 13h-16M27 22 37 9M18 5h5M35 5l2 4" stroke="#2DB34A" stroke-linecap="round" stroke-linejoin="round"/><path d="M33 5h5" stroke="#FFB310" stroke-linecap="round"/></g></svg></div>
      <div><div class="pname">Mongoose Tyax Comp Disc (T3)</div><div class="pid"></div><span class="master">Master</span></div>
    </div>
    <div class="tabs">
      <span><svg width="11" height="10" viewBox="0 0 11 10"><path d="M1 2h3l1 1h5v6H1z" fill="none" stroke="#111" stroke-width="1.1"/></svg>Assets</span>
      <span><svg width="10" height="10" viewBox="0 0 10 10"><rect x="1" y="1" width="7" height="8" rx="1" fill="none" stroke="#111" stroke-width="1.1"/></svg><em></em></span>
      <span><svg width="10" height="10" viewBox="0 0 10 10"><g fill="#111"><rect x="0" y="0" width="2.6" height="2.6"/><rect x="3.7" y="0" width="2.6" height="2.6"/><rect x="7.4" y="0" width="2.6" height="2.6"/><rect x="0" y="3.7" width="2.6" height="2.6"/><rect x="3.7" y="3.7" width="2.6" height="2.6"/><rect x="7.4" y="3.7" width="2.6" height="2.6"/><rect x="0" y="7.4" width="2.6" height="2.6"/><rect x="3.7" y="7.4" width="2.6" height="2.6"/><rect x="7.4" y="7.4" width="2.6" height="2.6"/></g></svg><em></em></span>
      <span><svg width="11" height="11" viewBox="0 0 11 11"><path d="M4.5 6.5 6.5 4.5M4 3.5l1-1a2 2 0 0 1 3 3l-1 1M7 7.5l-1 1a2 2 0 0 1-3-3l1-1" fill="none" stroke="#111" stroke-width="1.1" stroke-linecap="round"/></svg><em></em></span>
    </div>
    <div class="sec">Assets</div>
    <div id="rows"></div>
  </div>

  <div class="cta">Bring your messiest item to a demo →</div>
  <img class="lockup" src="assets/truvio-lockup-reversed.png" alt="truvio">
</div>
<pre id="qa"></pre>
<script>
const bike = '<svg width="26" height="17" viewBox="0 0 54 34"><g fill="none" stroke-width="3"><circle cx="11" cy="22" r="9" stroke="#1d2a30"/><circle cx="43" cy="22" r="9" stroke="#1d2a30"/><path d="M11 22 20 9h17l6 13M20 9l7 13h-16M27 22 37 9" stroke="#2DB34A" stroke-linejoin="round"/></g></svg>';
const dl = '<svg width="11" height="12" viewBox="0 0 11 12"><path d="M5.5 1v7M2.5 5.5l3 3 3-3M1.5 11h8" fill="none" stroke="#008FC4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

// Field helpers. k: readable label or null for a grey bar. v: 'txt:<text>' | 'bar' | 'ro' | 'tog'
const F = (k, v = 'bar', w) => {
  const key = k ? `<div class="k">${k}</div>` : `<div class="k bar" style="width:${40 + (w || 30)}%"></div>`;
  let val;
  if (v.startsWith('txt:')) val = `<div class="v">${v.slice(4)}</div>`;
  else if (v === 'ro') val = `<div class="v ro"><i style="--w:${w || 30}%"></i></div>`;
  else if (v === 'tog') val = `<div class="v tog"></div>`;
  else val = `<div class="v"><i style="--w:${w || 60}%"></i></div>`;
  return `<div class="f">${key}${val}</div>`;
};
const C = (lines, w) => `<div class="f custom"><div class="k bar" style="width:75%"></div><div class="v">${'<i></i>'.repeat(lines - 1)}<i style="--w:${w}%"></i></div></div>`;
const greys = (n, seed) => Array.from({length: n}, (_, i) => {
  const r = (seed * 7 + i * 13) % 5;
  return F(null, ['bar', 'ro', 'bar', 'tog', 'bar'][r], 35 + ((seed + i * 17) % 45));
}).join('');

const head = `<div class="crumb">Item Card</div><div class="title">10001 • Mongoose Tyax Comp Disc (T3)</div>`;
const acts = on => `<div class="actions">${[34, 52, 26, 60, 40, 30].map((w, i) => `<span class="${i === 0 && on ? 'on' : ''}" style="width:${w}px"></span>`).join('')}</div>`;

// Left: crammed. Two columns, custom enrichment fields in red, runs past the bottom of the card.
document.getElementById('messy').innerHTML = head + acts(true) +
  `<div class="tab">Item</div><div class="fields">` +
    F('No.', 'txt:10001') + F(null, 'bar', 50) +
    F('Description', 'bar', 85) + F(null, 'ro', 40) +
    F('Item Category Code', 'bar', 45) + F(null, 'tog') +
    greys(4, 1) +
    C(3, 62) +
    greys(4, 2) +
    C(2, 40) +
  `</div><div class="tab">Inventory</div><div class="fields">` +
    greys(6, 3) +
    C(3, 48) +
    greys(4, 4) +
  `</div><div class="tab">Prices &amp; Sales</div><div class="fields">` +
    greys(4, 5) + C(2, 70) + greys(8, 6) +
  `</div><div class="tab">Replenishment</div><div class="fields">` + greys(10, 7) + `</div>`;

// Right: the same card with only what BC needs. One column, room to breathe.
document.getElementById('clean').innerHTML = head + acts(true) +
  `<div class="tab">Item</div><div class="fields">` +
    F('No.', 'txt:10001') + F('Description', 'bar', 80) + F('Item Category Code', 'bar', 45) +
    F(null, 'tog') + F(null, 'bar', 50) + F(null, 'ro', 35) +
  `</div><div class="tab">Inventory</div><div class="fields">` + greys(5, 8) + `</div>`;

// Add asset rows only while they fit, so the clean side never shows a clipped row.
const pim = document.getElementById('pim'), rows = document.getElementById('rows');
const row = `<div class="row"><div class="t">${bike}</div><div><div class="fn"></div><div class="fs"></div></div><div class="en">EN</div>${dl}</div>`;
const pimBottom = () => pim.getBoundingClientRect().bottom - 16;
document.fonts.ready.then(() => {
  for (let i = 0; i < 20; i++) {
    rows.insertAdjacentHTML('beforeend', i === 3 ? '<div class="sec">Product Details</div>' + row : row);
    if (rows.lastElementChild.getBoundingClientRect().bottom > pimBottom()) {
      rows.lastElementChild.remove();
      if (rows.lastElementChild.classList.contains('sec')) rows.lastElementChild.remove();
      break;
    }
  }
});

document.fonts.ready.then(() => {
  const b = document.getElementById('board').getBoundingClientRect();
  const box = s => { const e = document.querySelector(s); if (!e) return null; const r = e.getBoundingClientRect();
    return {l:+(r.left-b.left).toFixed(1), t:+(r.top-b.top).toFixed(1), r:+(b.right-r.right).toFixed(1),
            bo:+(b.bottom-r.bottom).toFixed(1), w:+r.width.toFixed(1), h:+r.height.toFixed(1)}; };
  document.getElementById('qa').textContent = JSON.stringify({
    viewport: [innerWidth, innerHeight],
    headline: box('h1'), labelL: box('.label.l'), labelR: box('.label.r'), messy: box('.bc.messy'),
    clean: box('.bc.clean'), pim: box('.pim'), cta: box('.cta'), lockup: box('.lockup'),
    fontsLoaded: [...document.fonts].filter(f => f.status === 'loaded').map(f => f.family + ' ' + f.weight)});
});
</script>
</body>
</html>
